services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sanctions}
      SERVING_DB_USER: ${SERVING_DB_USER:-bank_api}
      SERVING_DB_PASSWORD: ${SERVING_DB_PASSWORD:-bank_api}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./db/schema.sql:/db/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      SERVING_DSN: postgresql://${SERVING_DB_USER:-bank_api}:${SERVING_DB_PASSWORD:-bank_api}@db:5432/${POSTGRES_DB:-sanctions}
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
